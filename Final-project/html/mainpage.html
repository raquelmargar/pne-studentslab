<!DOCTYPE html>
<html>
<head>
    <title>Browsing human and vertebrates genome</title>
</head>
<body style="background-color: rgb(121, 190, 255);">

<h1>Browsing human and vertebrates genome</h1>

<hr>

<h2>Basic level services</h2>

<p>1) List of species in the genome database</p>

<form action="/limitation" method="get">
    <label>Limit:</label>
    <input type="text" name="list">
    <br>
    <br>
    <button type="submit">Send</button>

</form>

<br>

<p>2) Information about the karyotype:</p>

<form action="/karyotype" method="get">
    <label>Select the species:</label>
    <input type="text" name="species">
    <br>
    <br>
    <button type="submit">Send</button>

</form>

<br>

<p>3) Chromosome length</p>

<form action="/length" method="get">
    <label>Select the species:</label>
    <input type="text" name="species 2">

    <br>
    <br>

    <label>Select a chromosome:</label>
    <input type="text" name="chromosome">
    <br>
    <br>
    <button type="submit">Send</button>

</form>

</body>
</html>
