<!DOCTYPE html>
<html>
<head>
    <title>List of species in the browser</title>
</head>
<body style="background-color: rgb(253, 181, 231);">

<p>The total number of species in the ensemble is: {{total}}</p>
<p>The limit that have been selected is: {{limit}}</p>
<p>The names of the species are:</p>

<ul>

{% for sp in species %}

<li>{{ sp }}</li>
{% endfor %}
</ul>
<a href="/">Main page</a>
</body>
</html>
