<h1>SEQ2 server</h1>

<p>Access to the Server</p>

<hr>

<p>Is the server alive?
    <form action="/ping" method="get" style="display:inline;">
    <button type="submit">PING</button>
    </form>
</p>

<hr>

<form action="/get" method="get" style="display: inline;">

    <label for="seq">Get a Sequence. Select sequence number:</label>

    <select name="seq" id="seq">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>

    <button type="submit">GET</button>
</form>
