<hr>

<p>Operation on a sequence:</p>

<form action="/operation" method="get">

    <label>Sequence:</label>
    <input type="text" name="seq">

    <br><br>

    <label>Operation:</label>

    <select name="op">
        <option value="1">Info</option>
        <option value="2">Complement</option>
        <option value="3">Reverse</option>
    </select>

    <br><br>

    <button type="submit">OPERATE</button>

</form>
